[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenizer"
version = "0.1.0"
description = "Byte-level BPE from scratch — trainer, encoder, decoder — compared against the tokenizer GPT-2 shipped."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["regex"]

[tool.setuptools.packages.find]
include = ["tokenizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
